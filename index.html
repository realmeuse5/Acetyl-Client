<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Acetyl</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="./client/Assets/favicon.svg">
</head>
<body>
    <div id="header">
        <img src="client/Assets/favicon.svg" onclick="window.location.href">
        <h1 onclick="window.location.origin">Acetyl</h1>
        <h2 onclick="window.location.origin">Home</h2>
        <h2 onclick="window.location.href = window.location.origin + '/client'">Client</h2>
        <h2 onclick="window.location.href = window.location.origin + '/support'">Support</h2>
        <h2 onclick="window.location.href = window.location.origin + '/pricing'">Pricing</h2>
        <h2 onclick="window.location.href = window.location.origin + '/other'">Other Stuff</h2>
    </div>
        
    <div id="content">
        <div id="section-1">
            <h2>Start chatting immedietly</h2>
            <h1>with <span>Acetyl Client</span></h1>
        </div>
        <div style="margin-top: 100vh;">hi</div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const text = "Acetyl Client";
        const span = document.querySelector("#section-1 h1 span");
        span.textContent = "";
        
        let i = 0;

        function typeCharacter() {
            if (i < text.length) {
                span.textContent += text.charAt(i);
                i++;
                setTimeout(typeCharacter, 200);
            }
        }

        typeCharacter();
    });
    </script>
</body>
</html>
