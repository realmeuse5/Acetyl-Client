<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/client/Assets/favicon.svg">
    
    <link rel="stylesheet" href="/components/global.css">
    <script src="/components/components.js" defer></script>

    <style>
        #content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 520px;
            margin: 0 auto;
            height: 85vh;
        }

        #content h1 {
            font-family: 'Cal Sans', sans-serif;
            background: linear-gradient(90deg, #4E00CA, #FF0044);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: transparent;
            font-size: 10rem;
            text-shadow: 0 0 30px rgba(30, 0, 255, 0.2);
            margin: 0;
        }

        #content h2 {
            font-family: 'Cal Sans', sans-serif;
            color: white;
            font-size: 2rem;
            margin: 0;
        }

        #content p {
            color: #96979e;
            font-family: 'DM Sans' sans-serif;
            font-size: 1rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <div id="content">
        <h1>404</h1>
        <h2>Whoops. You've reached the void.</h2>
        <p>It looks like the page you were trying to reach vanished into thin air, was moved, or was just a figment of your imagination all along. Either way, standing here in the dark won't help much.</p>
    </div>

    <div id="footer"></div>
</body>
</html>
